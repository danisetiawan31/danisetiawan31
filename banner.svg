<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16324D" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="280" fill="#0E2238"/>
  <rect width="1200" height="280" fill="url(#grid)" opacity="0.5"/>

  <path d="M30 80 L30 30 L80 30" stroke="#4A7FB5" stroke-width="2" fill="none" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="0.1s" fill="freeze"/>
  </path>
  <path d="M1170 200 L1170 250 L1120 250" stroke="#4A7FB5" stroke-width="2" fill="none" stroke-dasharray="100" stroke-dashoffset="100">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.6s" begin="0.2s" fill="freeze"/>
  </path>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <rect x="960" y="28" width="212" height="38" rx="19" fill="#12314F" stroke="#2E5A82" stroke-width="1"/>
    <circle cx="982" cy="47" r="5" fill="#3ECF8E">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="998" y="52" font-family="Consolas, Menlo, monospace" font-size="14" fill="#F4F7FA" letter-spacing="0.5">OPEN TO WORK</text>
  </g>

  <text x="62" y="90" font-family="Consolas, Menlo, monospace" font-size="13" fill="#8CA3BD" letter-spacing="3" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.3s" fill="freeze"/>
    SYSTEM.PROFILE
  </text>

  <text x="60" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="600" fill="#F4F7FA" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
    Hi, I'm
  </text>
  <text x="60" y="205" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="#F5A623" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.55s" fill="freeze"/>
    Ahmad Dhani Setiawan
  </text>

  <text x="60" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8CA3BD" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.75s" fill="freeze"/>
    Fullstack Developer
  </text>

  <line x1="60" y1="252" x2="460" y2="252" stroke="#2E5A82" stroke-width="1" stroke-dasharray="4,4" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.95s" fill="freeze"/>
  </line>

  <text x="60" y="270" font-family="Consolas, Menlo, monospace" font-size="11" fill="#4A7FB5" letter-spacing="2" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.05s" fill="freeze"/>
    INFORMATION SYSTEMS GRADUATE &#183; UNIVERSITAS JAMBI
  </text>
</svg>
